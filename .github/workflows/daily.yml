name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # SYSTEM DEPENDENCIES
      # ==================================================

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo "================================"
          echo "FFMPEG CHECK"
          echo "================================"

          ffmpeg -version
          ffprobe -version

      # ==================================================
      # PYTHON DEPENDENCIES
      # ==================================================

      - name: Install Python dependencies
        run: |
          echo "================================"
          echo "INSTALLING PYTHON PACKAGES"
          echo "================================"

          python -m pip install --upgrade pip

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found!"
            echo "Repository files:"
            find . -maxdepth 2 -type f | sort
            exit 1
          fi

          python -m pip install -r requirements.txt

      # ==================================================
      # PACKAGE CHECK
      # ==================================================

      - name: Check Python packages
        run: |
          echo "================================"
          echo "CHECKING PYTHON PACKAGES"
          echo "================================"

          python -c "from google import genai; print('google-genai: OK')"
          python -c "from elevenlabs.client import ElevenLabs; print('elevenlabs: OK')"
          python -c "import requests; print('requests: OK')"
          python -c "import moviepy; print('moviepy: OK')"

          echo "Python:"
          python --version

          echo "FFmpeg:"
          ffmpeg -version | head -1

          echo "FFprobe:"
          ffprobe -version | head -1

      # ==================================================
      # CHECK REQUIRED FILES
      # ==================================================

      - name: Check automation files
        run: |
          echo "================================"
          echo "CHECKING AUTOMATION FILES"
          echo "================================"

          REQUIRED_FILES="
          scripts/generate_script.py
          scripts/generate_voice.py
          download_clips.py
          create_video.py
          upload_video.py
          "

          FAILED=0

          for file in $REQUIRED_FILES; do
            if [ -f "$file" ]; then
              echo "OK: $file"
            else
              echo "MISSING: $file"
              FAILED=1
            fi
          done

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "ERROR: Required automation file is missing."
            echo ""
            echo "Repository structure:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

      # ==================================================
      # GENERATE DAILY SCRIPT
      # ==================================================

      - name: Generate daily script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          python scripts/generate_script.py

      # ==================================================
      # CHECK SCRIPT
      # ==================================================

      - name: Check generated script
        run: |
          echo "================================"
          echo "CHECKING GENERATED SCRIPT"
          echo "================================"

          if [ ! -f daily_script.txt ]; then
            echo "ERROR: daily_script.txt was not created."
            exit 1
          fi

          if [ ! -s daily_script.txt ]; then
            echo "ERROR: daily_script.txt is empty."
            exit 1
          fi

          echo ""
          echo "SCRIPT:"
          cat daily_script.txt
          echo ""

      # ==================================================
      # GENERATE FEMALE VOICE
      # ==================================================

      - name: Generate female voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python scripts/generate_voice.py

          if [ ! -f voice.mp3 ]; then
            echo "ERROR: voice.mp3 was not created."
            exit 1
          fi

          if [ ! -s voice.mp3 ]; then
            echo "ERROR: voice.mp3 is empty."
            exit 1
          fi

          echo "Voice generated successfully."

      # ==================================================
      # DOWNLOAD VIDEO CLIPS
      # ==================================================

      - name: Download video clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "================================"
          echo "DOWNLOADING RELEVANT CLIPS"
          echo "================================"

          mkdir -p clips

          python download_clips.py

      # ==================================================
      # CHECK CLIPS
      # ==================================================

      - name: Check video clips
        run: |
          echo "================================"
          echo "CHECKING VIDEO CLIPS"
          echo "================================"

          mkdir -p clips

          COUNT=$(find clips -type f \
            \( -iname "*.mp4" \
            -o -iname "*.mov" \
            -o -iname "*.webm" \) \
            | wc -l)

          echo "Video clips found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No video clips found."
            echo ""
            echo "Possible causes:"
            echo "1. PEXELS_API_KEY missing"
            echo "2. Pexels API request failed"
            echo "3. download_clips.py did not save clips"
            echo ""
            exit 1
          fi

      # ==================================================
      # CREATE VIDEO
      # ==================================================

      - name: Create USA Dose video
        run: |
          echo "================================"
          echo "CREATING USA DOSE HD VIDEO"
          echo "================================"

          ffprobe -version

          python create_video.py

          if [ ! -f usa_dose_short.mp4 ]; then
            echo "ERROR: usa_dose_short.mp4 was not created."
            exit 1
          fi

          if [ ! -s usa_dose_short.mp4 ]; then
            echo "ERROR: usa_dose_short.mp4 is empty."
            exit 1
          fi

          echo "Video created successfully."

      # ==================================================
      # UPLOAD TO YOUTUBE
      # ==================================================

      - name: Upload video to YouTube
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "================================"
          echo "UPLOADING TO YOUTUBE"
          echo "================================"

          python upload_video.py

      # ==================================================
      # SAVE GENERATED FILES
      # ==================================================

      - name: Save generated files
        if: always()
        run: |
          echo "================================"
          echo "SAVING GENERATED FILES"
          echo "================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for file in \
            daily_script.txt \
            video_title.txt \
            video_hashtags.txt \
            voice.mp3 \
            usa_dose_short.mp4
          do

            if [ -f "$file" ]; then
              echo "Adding: $file"
              git add "$file"
            else
              echo "Not found: $file"
            fi

          done

          if git diff --cached --quiet; then
            echo "No files to commit."
          else
            git commit -m "Generate daily USA Dose content"
            git push || true
          fi

          echo "================================"
          echo "SAVE STEP FINISHED"
          echo "================================"

name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    # Every day at 9:00 PM IST
    # 15:30 UTC = 9:00 PM IST
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:

  build-video:

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================================================
      # PYTHON
      # ==================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==================================================
      # FFMPEG
      # IMPORTANT - fixes ffprobe error
      # ==================================================

      - name: Install FFmpeg
        run: |
          echo "================================"
          echo "INSTALLING FFMPEG"
          echo "================================"

          sudo apt-get update
          sudo apt-get install -y ffmpeg

          echo ""
          echo "Checking ffmpeg..."
          ffmpeg -version

          echo ""
          echo "Checking ffprobe..."
          ffprobe -version

          echo ""
          echo "FFmpeg installation PASSED"
          echo "================================"

      # ==================================================
      # PYTHON DEPENDENCIES
      # ==================================================

      - name: Install Python dependencies
        run: |
          echo "================================"
          echo "INSTALLING PYTHON DEPENDENCIES"
          echo "================================"

          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install edge-tts

          echo ""
          echo "Python dependencies installed."
          echo "================================"

      # ==================================================
      # CHECK REQUIRED FILES
      # ==================================================

      - name: Check project files
        run: |
          echo "================================"
          echo "CHECKING PROJECT FILES"
          echo "================================"

          echo ""
          echo "Repository:"
          pwd

          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort

          echo ""
          echo "================================"

          test -f create_video.py || {
            echo "ERROR: create_video.py not found."
            exit 1
          }

          echo "create_video.py: OK"

          if [ -f scripts/generate_script.py ]; then
            echo "scripts/generate_script.py: OK"
          fi

          if [ -f scripts/generate_voice.py ]; then
            echo "scripts/generate_voice.py: OK"
          fi

          if [ -f generate_script.py ]; then
            echo "generate_script.py: OK"
          fi

          if [ -f generate_voice.py ]; then
            echo "generate_voice.py: OK"
          fi

          echo ""
          echo "Project file check PASSED."
          echo "================================"

      # ==================================================
      # GENERATE DAILY SCRIPT
      # ==================================================

      - name: Generate daily script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |

          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          if [ -f scripts/generate_script.py ]; then

            python scripts/generate_script.py

          elif [ -f generate_script.py ]; then

            python generate_script.py

          else

            echo "ERROR: Script generator not found."
            exit 1

          fi

          echo ""
          echo "================================"
          echo "SCRIPT GENERATION FINISHED"
          echo "================================"

          test -f daily_script.txt || {
            echo "ERROR: daily_script.txt was not created."
            exit 1
          }

          echo ""
          echo "Generated script:"
          cat daily_script.txt

          echo ""
          echo "================================"

      # ==================================================
      # GENERATE VOICE
      # ==================================================

      - name: Generate female voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
        run: |

          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          if [ -f scripts/generate_voice.py ]; then

            python scripts/generate_voice.py

          elif [ -f generate_voice.py ]; then

            python generate_voice.py

          else

            echo "ERROR: generate_voice.py not found."
            exit 1

          fi

          echo ""
          echo "================================"
          echo "VOICE CHECK"
          echo "================================"

          test -f voice.mp3 || {
            echo "ERROR: voice.mp3 was not created."
            exit 1
          }

          test -s voice.mp3 || {
            echo "ERROR: voice.mp3 is empty."
            exit 1
          }

          echo "voice.mp3 created successfully."

          echo ""
          echo "Voice duration:"
          ffprobe \
            -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 \
            voice.mp3

          echo ""
          echo "================================"

      # ==================================================
      # DOWNLOAD VIDEO CLIPS
      # ==================================================

      - name: Download relevant clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          echo "================================"
          echo "DOWNLOADING RELEVANT CLIPS"
          echo "================================"

          if [ -f scripts/download_clips.py ]; then

            python scripts/download_clips.py

          elif [ -f download_clips.py ]; then

            python download_clips.py

          else

            echo "ERROR: download_clips.py not found."
            exit 1

          fi

          echo ""
          echo "================================"
          echo "CLIP CHECK"
          echo "================================"

          if [ -d clips ]; then

            echo "Clips directory found."

            find clips -type f -maxdepth 2 -print

          elif [ -d video_clips ]; then

            echo "video_clips directory found."

            find video_clips -type f -maxdepth 2 -print

          else

            echo "ERROR: No clips directory found."
            exit 1

          fi

          echo ""
          echo "================================"

      # ==================================================
      # CREATE VIDEO
      # ==================================================

      - name: Create USA Dose HD video
        run: |

          echo "================================"
          echo "CREATING USA DOSE HD VIDEO"
          echo "================================"

          echo ""
          echo "FFmpeg:"
          command -v ffmpeg

          echo ""
          echo "FFprobe:"
          command -v ffprobe

          echo ""
          echo "Voice file:"
          ls -lh voice.mp3

          echo ""
          echo "Starting video creator..."
          echo "================================"

          python create_video.py

          echo ""
          echo "================================"
          echo "VIDEO CREATION FINISHED"
          echo "================================"

          test -f usa_dose_short.mp4 || {
            echo "ERROR: usa_dose_short.mp4 was not created."
            exit 1
          }

          test -s usa_dose_short.mp4 || {
            echo "ERROR: usa_dose_short.mp4 is empty."
            exit 1
          }

          echo ""
          echo "Video created successfully:"
          ls -lh usa_dose_short.mp4

          echo ""
          echo "Video information:"
          ffprobe \
            -v error \
            -show_entries \
            format=duration,size \
            -of default=noprint_wrappers=1 \
            usa_dose_short.mp4

          echo ""
          echo "================================"

      # ==================================================
      # CHECK TITLE + HASHTAGS
      # ==================================================

      - name: Check YouTube metadata
        run: |

          echo "================================"
          echo "CHECKING VIDEO METADATA"
          echo "================================"

          if [ -f video_title.txt ]; then

            echo ""
            echo "TITLE:"
            cat video_title.txt

          else

            echo ""
            echo "WARNING: video_title.txt not found."

          fi

          if [ -f video_hashtags.txt ]; then

            echo ""
            echo "HASHTAGS:"
            cat video_hashtags.txt

            echo ""
            echo "Hashtag count:"
            grep -o '#[A-Za-z0-9_]*' video_hashtags.txt | wc -l

          else

            echo ""
            echo "WARNING: video_hashtags.txt not found."

          fi

          echo ""
          echo "================================"

      # ==================================================
      # UPLOAD TO YOUTUBE
      # ==================================================

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          echo "================================"
          echo "UPLOADING TO YOUTUBE"
          echo "================================"

          if [ -f upload_video.py ]; then

            python upload_video.py

          elif [ -f scripts/upload_video.py ]; then

            python scripts/upload_video.py

          else

            echo "ERROR: upload_video.py not found."
            exit 1

          fi

          echo ""
          echo "================================"
          echo "YOUTUBE UPLOAD FINISHED"
          echo "================================"

      # ==================================================
      # SAVE GENERATED FILES
      # ==================================================

      - name: Commit generated metadata
        run: |

          echo "================================"
          echo "SAVING GENERATED FILES"
          echo "================================"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            daily_script.txt \
            video_title.txt \
            video_hashtags.txt \
            voice.mp3 \
            usa_dose_short.mp4 \
            2>/dev/null || true

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Generate daily USA Dose video"

            git push

          fi

          echo ""
          echo "================================"
          echo "AUTOMATION COMPLETED"
          echo "================================"

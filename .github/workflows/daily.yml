```yaml
name: USA Dose Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

jobs:
  generate-video:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # INSTALL DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

          pip install google-genai
          pip install elevenlabs
          pip install edge-tts
          pip install requests
          pip install moviepy
          pip install imageio
          pip install imageio-ffmpeg

      # =====================================================
      # CHECK FILES
      # =====================================================

      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILE CHECK"
          echo "================================"

          echo "Current directory:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "Scripts directory:"
          if [ -d scripts ]; then
            ls -la scripts
          else
            echo "scripts directory does not exist"
          fi

          echo ""
          echo "================================"

      # =====================================================
      # GENERATE DAILY SCRIPT
      # =====================================================

      - name: Generate daily script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |

          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          python scripts/generate_script.py

      # =====================================================
      # VERIFY SCRIPT
      # =====================================================

      - name: Verify generated content
        run: |

          echo "================================"
          echo "VERIFYING GENERATED CONTENT"
          echo "================================"

          test -s daily_script.txt
          test -s video_title.txt
          test -s video_hashtags.txt

          echo ""
          echo "SCRIPT:"
          cat daily_script.txt

          echo ""
          echo "TITLE:"
          cat video_title.txt

          echo ""
          echo "HASHTAGS:"
          cat video_hashtags.txt

          echo ""
          echo "CONTENT CHECK PASSED"

      # =====================================================
      # GENERATE FEMALE VOICE
      # =====================================================

      - name: Generate female voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}
          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}
          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}
        run: |

          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python scripts/generate_voice.py

      # =====================================================
      # VERIFY VOICE
      # =====================================================

      - name: Verify voice
        run: |

          echo "================================"
          echo "VERIFYING VOICE"
          echo "================================"

          if [ ! -s voice.mp3 ]; then
            echo "ERROR: voice.mp3 was not created."
            exit 1
          fi

          ls -lh voice.mp3

          echo "VOICE CHECK PASSED"

      # =====================================================
      # DOWNLOAD RELEVANT CLIPS
      # =====================================================

      - name: Download relevant clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |

          echo "================================"
          echo "DOWNLOADING RELEVANT CLIPS"
          echo "================================"

          # download_clips.py is in ROOT, not scripts/
          python download_clips.py

      # =====================================================
      # VERIFY CLIPS
      # =====================================================

      - name: Verify downloaded clips
        run: |

          echo "================================"
          echo "VERIFYING VIDEO CLIPS"
          echo "================================"

          echo "Searching for video files..."

          find . -type f \( \
            -iname "*.mp4" -o \
            -iname "*.mov" -o \
            -iname "*.mkv" \
          \) -not -path "./.git/*" -print

          CLIP_COUNT=$(find . -type f \( \
            -iname "*.mp4" -o \
            -iname "*.mov" -o \
            -iname "*.mkv" \
          \) -not -path "./.git/*" | wc -l)

          echo ""
          echo "Video files found: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -eq 0 ]; then
            echo ""
            echo "ERROR: No video clips were downloaded."
            echo "Video generation stopped safely."
            exit 1
          fi

          echo ""
          echo "CLIP CHECK PASSED"

      # =====================================================
      # CREATE HD VIDEO
      # =====================================================

      - name: Create HD video
        run: |

          echo "================================"
          echo "CREATING USA DOSE HD VIDEO"
          echo "================================"

          python create_video.py

      # =====================================================
      # VERIFY VIDEO
      # =====================================================

      - name: Verify final video
        run: |

          echo "================================"
          echo "VERIFYING FINAL VIDEO"
          echo "================================"

          if [ ! -s usa_dose_short.mp4 ]; then
            echo "ERROR: usa_dose_short.mp4 was not created."
            exit 1
          fi

          ls -lh usa_dose_short.mp4

          echo ""
          echo "VIDEO CHECK PASSED"

      # =====================================================
      # UPLOAD TO YOUTUBE AS PRIVATE
      # =====================================================

      - name: Upload video to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |

          echo "================================"
          echo "UPLOADING TO YOUTUBE"
          echo "================================"

          python upload_video.py

      # =====================================================
      # SAVE GENERATED CONTENT
      # =====================================================

      - name: Commit generated content
        run: |

          git config user.name "USA Dose Automation"
          git config user.email "actions@users.noreply.github.com"

          git add \
            daily_script.txt \
            video_title.txt \
            video_hashtags.txt

          git diff --cached --quiet || \
            git commit -m "Generate daily USA Dose content"

          git push || true

      # =====================================================
      # FINAL
      # =====================================================

      - name: Automation complete
        run: |

          echo "================================"
          echo "USA DOSE AUTOMATION COMPLETE"
          echo "================================"

          echo "Script: READY"
          echo "Female voice: READY"
          echo "Video clips: READY"
          echo "HD video: READY"
          echo "Title: READY"
          echo "Hashtags: READY"
          echo "YouTube upload: PRIVATE"

          echo "================================"
```

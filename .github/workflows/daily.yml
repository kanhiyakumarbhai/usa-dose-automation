name: USA Dose Daily Automation

on:
  workflow_dispatch:
  schedule:
    # रोज़ UTC 13:00 = India 18:30
    # इसे बाद में USA audience के हिसाब से बदल सकते हैं
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:

  build-video:

    runs-on: ubuntu-latest

    steps:

      # ====================================================
      # CHECKOUT
      # ====================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ====================================================
      # PYTHON
      # ====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ====================================================
      # SYSTEM PACKAGES
      # ====================================================

      - name: Install system packages
        run: |

          sudo apt-get update

          sudo apt-get install -y \
            ffmpeg \
            fonts-dejavu


      # ====================================================
      # PYTHON PACKAGES
      # ====================================================

      - name: Install Python packages
        run: |

          python -m pip install --upgrade pip

          pip install elevenlabs
          pip install edge-tts
          pip install requests
          pip install google-genai

          pip install google-api-python-client
          pip install google-auth
          pip install google-auth-oauthlib
          pip install google-auth-httplib2


      # ====================================================
      # FOLDER SETUP
      # ====================================================

      - name: Create folders
        run: |

          mkdir -p scripts
          mkdir -p output
          mkdir -p clips


      # ====================================================
      # GENERATE ORIGINAL SCRIPT
      # ====================================================

      - name: Generate daily script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |

          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          python scripts/generate_script.py


      # ====================================================
      # CHECK SCRIPT FILE
      # ====================================================

      - name: Check generated script
        run: |

          echo "================================"
          echo "SCRIPT FILE CHECK"
          echo "================================"

          if [ ! -f daily_script.txt ]; then

            echo "ERROR: daily_script.txt not found."

            exit 1

          fi

          echo ""
          echo "Generated script:"
          echo "--------------------------------"

          cat daily_script.txt

          echo ""
          echo "--------------------------------"


      # ====================================================
      # GENERATE VOICE
      # ====================================================

      - name: Generate female voice
        env:

          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

          ELEVENLABS_API_KEY_1: ${{ secrets.ELEVENLABS_API_KEY_1 }}

          ELEVENLABS_API_KEY_2: ${{ secrets.ELEVENLABS_API_KEY_2 }}

          ELEVENLABS_API_KEY_3: ${{ secrets.ELEVENLABS_API_KEY_3 }}

          ELEVENLABS_API_KEY_4: ${{ secrets.ELEVENLABS_API_KEY_4 }}

          ELEVENLABS_API_KEY_5: ${{ secrets.ELEVENLABS_API_KEY_5 }}

        run: |

          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python create_video.py


      # ====================================================
      # VERIFY VOICE
      # ====================================================

      - name: Verify voice
        run: |

          echo "================================"
          echo "VOICE FILE CHECK"
          echo "================================"

          if [ ! -f voice.mp3 ]; then

            echo "ERROR: voice.mp3 was not created."

            echo "Video generation will NOT continue."

            exit 1

          fi

          SIZE=$(stat -c%s voice.mp3)

          echo "Voice file size: ${SIZE} bytes"

          if [ "$SIZE" -le 0 ]; then

            echo "ERROR: voice.mp3 is empty."

            exit 1

          fi

          echo "Voice check: PASSED"


      # ====================================================
      # DOWNLOAD RELEVANT CLIPS
      # ====================================================

      - name: Download relevant clips
        env:

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

        run: |

          echo "================================"
          echo "DOWNLOADING RELEVANT CLIPS"
          echo "================================"

          python download_clips.py


      # ====================================================
      # CREATE HD SHORT
      # ====================================================

      - name: Create HD 1080x1920 video
        run: |

          echo "================================"
          echo "CREATING HD VIDEO"
          echo "================================"

          python scripts/create_video.py


      # ====================================================
      # VERIFY VIDEO
      # ====================================================

      - name: Verify video
        run: |

          echo "================================"
          echo "VIDEO CHECK"
          echo "================================"

          if [ ! -f output/final.mp4 ]; then

            echo "ERROR: output/final.mp4 not found."

            exit 1

          fi

          SIZE=$(stat -c%s output/final.mp4)

          echo "Video size: ${SIZE} bytes"

          if [ "$SIZE" -le 0 ]; then

            echo "ERROR: Video file is empty."

            exit 1

          fi

          echo "Video check: PASSED"


      # ====================================================
      # YOUTUBE UPLOAD - PRIVATE
      # ====================================================

      - name: Upload to YouTube as Private
        env:

          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}

          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}

          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

        run: |

          echo "================================"
          echo "UPLOADING TO YOUTUBE"
          echo "================================"

          python scripts/upload_video.py


      # ====================================================
      # SAVE GENERATED FILES
      # ====================================================

      - name: Upload workflow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:

          name: usa-dose-daily-output

          path: |

            daily_script.txt
            voice.mp3
            output/final.mp4

          if-no-files-found: ignore


      # ====================================================
      # FINISHED
      # ====================================================

      - name: Automation complete
        run: |

          echo ""
          echo "================================"
          echo "USA DOSE AUTOMATION COMPLETE"
          echo "================================"

          echo "Original script: YES"
          echo "Female voice: YES"
          echo "HD video: YES"
          echo "Video format: 1080x1920"
          echo "YouTube visibility: PRIVATE"
          echo ""
          echo "Every video should use:"
          echo "- Different topic"
          echo "- Different script"
          echo "- Different title"
          echo "- 5-7 relevant hashtags"
          echo "- Relevant clips"
          echo "================================"

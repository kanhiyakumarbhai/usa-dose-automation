name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    # 13:30 UTC = 19:00 IST
    - cron: "30 13 * * *"

    # 16:30 UTC = 22:00 IST
    - cron: "30 16 * * *"

    # 19:30 UTC = 01:00 IST (next day)
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Download repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # 3. Install Python packages
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip

          python -m pip install google-genai
          python -m pip install google-api-python-client
          python -m pip install google-auth
          python -m pip install google-auth-httplib2
          python -m pip install google-auth-oauthlib

          python -m pip install elevenlabs
          python -m pip install requests

      # ==========================================
      # 4. Install FFmpeg
      # ==========================================
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # ==========================================
      # 5. Check required files
      # ==========================================
      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          echo "Root:"
          ls -lah

          echo ""
          echo "Scripts:"
          ls -lah scripts || true

          echo ""
          echo "Checking required files..."

          test -f scripts/generate_script.py
          test -f scripts/generate_voice.py
          test -f scripts/create_video.py
          test -f scripts/find_voices.py
          test -f upload_video.py

          echo ""
          echo "All required files found."

      # ==========================================
      # 6. Find available female voices
      # ==========================================
      - name: Find Female American Voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/find_voices.py

      # ==========================================
      # 7. Generate AI script
      # ==========================================
      - name: Generate AI USA Short Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py

      # ==========================================
      # 8. Check generated script
      # ==========================================
      - name: Check daily script
        run: |
          echo "================================"
          echo "DAILY SCRIPT"
          echo "================================"

          test -f daily_script.txt

          cat daily_script.txt

          echo ""
          echo "Word count:"
          wc -w daily_script.txt

      # ==========================================
      # 9. Generate ElevenLabs voice
      # ==========================================
      - name: Generate ElevenLabs Female Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generate_voice.py

      # ==========================================
      # 10. Check voice
      # ==========================================
      - name: Check voice file
        run: |
          echo "================================"
          echo "VOICE FILE"
          echo "================================"

          test -f voice.mp3
          ls -lh voice.mp3

      # ==========================================
      # 11. Create Short video
      # ==========================================
      - name: Create YouTube Short
        run: |
          python scripts/create_video.py

      # ==========================================
      # 12. Check video
      # ==========================================
      - name: Check generated video
        run: |
          echo "================================"
          echo "VIDEO FILE"
          echo "================================"

          test -f usa_dose_short.mp4
          ls -lh usa_dose_short.mp4

          echo ""
          echo "Video information:"

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            usa_dose_short.mp4

      # ==========================================
      # 13. Upload to YouTube
      # ==========================================
      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_video.py

      # ==========================================
      # 14. Save generated script
      # ==========================================
      - name: Save generated script
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt

          if git diff --cached --quiet; then
            echo "No new script changes to commit."
          else
            git commit -m "Generate daily USA Short"
            git push
          fi

      # ==========================================
      # 15. Final status
      # ==========================================
      - name: Automation completed
        run: |
          echo "================================"
          echo "USA DOSE AUTOMATION SUCCESS"
          echo "================================"
          echo "Script generated       : YES"
          echo "ElevenLabs voice       : YES"
          echo "Short video generated  : YES"
          echo "YouTube upload         : YES"
          echo "================================"

name: USA Dose Daily Automation

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Gemini SDK
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai

      - name: Check Gemini Secret
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY secret is missing"
            exit 1
          fi
          echo "Gemini API key is available."

      - name: Generate AI USA Short Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py

      - name: Save generated script
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate AI USA script"
            git push
          fi

name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 13 * * *"
    - cron: "30 16 * * *"
    - cron: "30 19 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install google-genai
          python -m pip install google-api-python-client
          python -m pip install google-auth
          python -m pip install google-auth-httplib2
          python -m pip install google-auth-oauthlib
          python -m pip install elevenlabs
          python -m pip install requests

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -lah

          echo ""
          echo "Scripts:"
          ls -lah scripts

          echo ""
          echo "Checking required files..."

          test -f scripts/generate_script.py
          test -f scripts/generate_voice.py
          test -f scripts/create_video.py
          test -f find_voices.py
          test -f upload_video.py

          echo ""
          echo "All required files found."

      - name: Find Female American Voices
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python find_voices.py

      - name: Generate AI USA Short Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py

      - name: Check daily script
        run: |
          echo "================================"
          echo "DAILY SCRIPT"
          echo "================================"

          test -f daily_script.txt
          cat daily_script.txt

          echo ""
          echo "Word count:"
          wc -w daily_script.txt

      - name: Generate ElevenLabs Female Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generate_voice.py

      - name: Check voice file
        run: |
          test -f voice.mp3
          ls -lh voice.mp3

      - name: Create YouTube Short
        run: |
          python scripts/create_video.py

      - name: Check generated video
        run: |
          test -f usa_dose_short.mp4
          ls -lh usa_dose_short.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height \
            -of default=noprint_wrappers=1 \
            usa_dose_short.mp4

      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_video.py

      - name: Save generated script
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate daily USA Short"
            git push
          fi

      - name: Automation completed
        run: |
          echo "================================"
          echo "USA DOSE AUTOMATION SUCCESS"
          echo "================================"

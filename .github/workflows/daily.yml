name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    # Short 1
    # 00:30 UTC = 06:00 AM IST
    - cron: "30 0 * * *"

    # Short 2
    # 12:30 UTC = 06:00 PM IST
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # PYTHON
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # SYSTEM PACKAGES
      # ==========================================
      - name: Install FFmpeg and eSpeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      # ==========================================
      # PYTHON PACKAGES
      # ==========================================
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install elevenlabs requests

      # ==========================================
      # CHECK FILES
      # ==========================================
      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -lah
          echo ""

          if [ ! -f "daily_script.txt" ]; then
            echo "ERROR: daily_script.txt not found"
            exit 1
          fi

          if [ ! -f "scripts/generate_voice.py" ]; then
            echo "ERROR: scripts/generate_voice.py not found"
            exit 1
          fi

          if [ ! -f "create_video.py" ]; then
            echo "ERROR: create_video.py not found"
            exit 1
          fi

          echo "Required files found."

      # ==========================================
      # GENERATE DAILY SCRIPT
      # ==========================================
      - name: Generate daily script
        run: |
          if [ -f "scripts/generate_script.py" ]; then
            python scripts/generate_script.py
          else
            echo "generate_script.py not found."
            echo "Using existing daily_script.txt"
          fi

      # ==========================================
      # GENERATE FEMALE ELEVENLABS VOICE
      # ==========================================
      - name: Generate Laura Female Voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python scripts/generate_voice.py

          if [ ! -f "voice.mp3" ]; then
            echo "ERROR: voice.mp3 was not created"
            exit 1
          fi

          ls -lh voice.mp3

      # ==========================================
      # DOWNLOAD MOVING STOCK CLIPS
      # ==========================================
      - name: Download moving stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "================================"
          echo "DOWNLOADING MOVING STOCK CLIPS"
          echo "================================"

          if [ -f "download_clips.py" ]; then
            python download_clips.py
          else
            echo "ERROR: download_clips.py not found"
            exit 1
          fi

          echo ""
          echo "Downloaded clips:"
          find clips -maxdepth 1 -type f -print 2>/dev/null || true

      # ==========================================
      # CREATE FINAL SHORT
      # ==========================================
      - name: Create USA Dose Short
        run: |
          echo "================================"
          echo "CREATING USA DOSE SHORT"
          echo "================================"

          python create_video.py

          if [ ! -f "usa_dose_short.mp4" ]; then
            echo "ERROR: usa_dose_short.mp4 was not created"
            exit 1
          fi

          echo ""
          echo "FINAL VIDEO:"
          ls -lh usa_dose_short.mp4

      # ==========================================
      # UPLOAD TO YOUTUBE
      # ==========================================
      - name: Upload Short to YouTube
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "================================"
          echo "UPLOADING USA DOSE SHORT"
          echo "================================"

          if [ ! -f "upload_video.py" ]; then
            echo "ERROR: upload_video.py not found"
            exit 1
          fi

          python upload_video.py

      # ==========================================
      # SAVE UPDATED FILES
      # ==========================================
      - name: Commit generated files
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt voice.mp3 usa_dose_short.mp4 2>/dev/null || true

          git diff --cached --quiet || git commit -m "Daily USA Dose Short"

          git push || true

      # ==========================================
      # DONE
      # ==========================================
      - name: Complete
        run: |
          echo "================================"
          echo "USA DOSE AUTOMATION COMPLETE"
          echo "================================"
          echo "Female voice: Laura"
          echo "Moving clips: YES"
          echo "Short duration: 30-40 seconds"
          echo "Daily videos: 2"
          echo "Schedule: 00:30 UTC and 12:30 UTC"
          echo "================================"

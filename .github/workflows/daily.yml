```yaml
name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 0 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

jobs:
  create-and-upload:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and eSpeak
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install elevenlabs requests google-genai
          pip install google-api-python-client google-auth google-auth-oauthlib google-auth-httplib2

      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -lah
          echo ""
          ls -lah scripts || true

          test -f daily_script.txt || exit 1
          test -f scripts/generate_script.py || exit 1
          test -f scripts/generate_voice.py || exit 1
          test -f create_video.py || exit 1
          test -f download_clips.py || exit 1
          test -f upload_video.py || exit 1

          echo "All required files found."

      - name: Generate daily USA Dose script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          python scripts/generate_script.py

          test -s daily_script.txt

          echo "SCRIPT GENERATED"
          wc -c daily_script.txt

      - name: Generate female voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python scripts/generate_voice.py

          test -f voice.mp3
          test -s voice.mp3

          ls -lh voice.mp3

      - name: Download moving stock clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "================================"
          echo "DOWNLOADING MOVING STOCK CLIPS"
          echo "================================"

          rm -rf clips
          mkdir -p clips

          python download_clips.py

          CLIP_COUNT=$(find clips -maxdepth 1 -type f \
            \( -name "*.mp4" -o -name "*.mov" \) | wc -l)

          echo "Clip count: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -lt 1 ]; then
            echo "ERROR: No video clips found"
            exit 1
          fi

      - name: Create USA Dose Short
        run: |
          echo "================================"
          echo "CREATING USA DOSE SHORT"
          echo "================================"

          python create_video.py

          if [ ! -f "usa_dose_short.mp4" ]; then
            echo "ERROR: Video was not created"
            exit 1
          fi

          echo "FINAL VIDEO:"
          ls -lh usa_dose_short.mp4

          ffprobe \
            -v error \
            -select_streams v:0 \
            -show_entries stream=codec_name,width,height,r_frame_rate \
            -of default=noprint_wrappers=1 \
            usa_dose_short.mp4 || true

      - name: Upload Short to YouTube - PRIVATE ONLY
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

          # IMPORTANT:
          # Video will NOT be published automatically.
          # upload_video.py must use privacyStatus = private.
          YOUTUBE_PRIVACY_STATUS: private

        run: |
          echo "================================"
          echo "UPLOADING SHORT - PRIVATE"
          echo "================================"

          python upload_video.py

          echo ""
          echo "================================"
          echo "UPLOAD COMPLETE"
          echo "VIDEO IS PRIVATE"
          echo "AUTOMATIC PUBLIC PUBLISHING IS OFF"
          echo "================================"

      - name: Save generated files
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt voice.mp3 usa_dose_short.mp4 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Generate daily USA Dose video"
            git push
          fi

      - name: Automation complete
        run: |
          echo ""
          echo "================================"
          echo "USA DOSE AUTOMATION COMPLETE"
          echo "================================"
          echo "Video created: YES"
          echo "Voice: Female"
          echo "Moving clips: YES"
          echo "Captions: YES"
          echo "YouTube upload: PRIVATE"
          echo "Automatic PUBLIC: OFF"
          echo "================================"
```

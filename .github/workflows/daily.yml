name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    # 2:00 AM IST
    - cron: "30 20 * * *"

    # 5:00 AM IST
    - cron: "30 23 * * *"

    # 8:00 AM IST
    - cron: "30 2 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install FFmpeg and TTS
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          python -m pip install elevenlabs
          python -m pip install google-genai
          python -m pip install google-api-python-client
          python -m pip install google-auth
          python -m pip install google-auth-httplib2
          python -m pip install google-auth-oauthlib

      # ========================================
      # CHECK FILES
      # ========================================

      - name: Check project files
        run: |
          echo "================================"
          echo "PROJECT FILES"
          echo "================================"

          ls -lah
          echo ""
          echo "Scripts:"
          ls -lah scripts

          echo ""
          echo "Checking required files..."

          test -f daily_script.txt
          test -f scripts/generate_script.py
          test -f scripts/generate_voice.py
          test -f create_video.py
          test -f download_clips.py
          test -f upload_video.py

          echo ""
          echo "ALL REQUIRED FILES FOUND"

      # ========================================
      # GENERATE SCRIPT
      # ========================================

      - name: Generate daily USA script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/generate_script.py

      - name: Check generated script
        run: |
          echo "================================"
          echo "DAILY USA SCRIPT"
          echo "================================"

          test -f daily_script.txt
          cat daily_script.txt

      # ========================================
      # DOWNLOAD USA MOVING VIDEOS
      # ========================================

      - name: Download USA stock videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          rm -rf clips
          python download_clips.py

      - name: Check downloaded clips
        run: |
          echo "================================"
          echo "USA STOCK VIDEOS"
          echo "================================"

          test -d clips

          ls -lh clips

          CLIP_COUNT=$(find clips -type f -name "*.mp4" | wc -l)

          echo ""
          echo "Clips downloaded: $CLIP_COUNT"

          if [ "$CLIP_COUNT" -lt 3 ]; then
            echo "ERROR: Less than 3 clips downloaded."
            exit 1
          fi

      # ========================================
      # GENERATE VOICE
      # ========================================

      - name: Generate voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          python scripts/generate_voice.py

      - name: Check voice
        run: |
          echo "================================"
          echo "VOICE"
          echo "================================"

          test -f voice.mp3
          ls -lh voice.mp3

      # ========================================
      # CREATE VIDEO
      # ========================================

      - name: Create moving video
        run: |
          python create_video.py

      # ========================================
      # CHECK VIDEO
      # ========================================

      - name: Check final video
        run: |
          echo "================================"
          echo "FINAL VIDEO"
          echo "================================"

          test -f usa_dose_short.mp4

          ls -lh usa_dose_short.mp4

          ffprobe \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=codec_name,width,height,pix_fmt \
            -of default=noprint_wrappers=1 \
            usa_dose_short.mp4

      # ========================================
      # UPLOAD YOUTUBE
      # ========================================

      - name: Upload YouTube Short
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python upload_video.py

      # ========================================
      # SAVE SCRIPT
      # ========================================

      - name: Save generated script
        run: |
          git config user.name "USA Dose Bot"
          git config user.email "actions@users.noreply.github.com"

          git add daily_script.txt

          if git diff --cached --quiet; then
            echo "No script changes."
          else
            git commit -m "Generate daily USA Short"
            git push
          fi

      # ========================================
      # SUCCESS
      # ========================================

      - name: Automation completed
        run: |
          echo ""
          echo "================================"
          echo "USA DOSE AUTOMATION SUCCESS"
          echo "================================"
          echo "Script: OK"
          echo "Stock videos: OK"
          echo "Voice: OK"
          echo "Video: OK"
          echo "YouTube: OK"
          echo "================================"

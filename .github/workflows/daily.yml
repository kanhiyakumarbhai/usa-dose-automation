name: USA Dose Daily Automation

on:
  workflow_dispatch:

  schedule:
    - cron: "30 15 * * *"

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python packages
        run: |
          python -c "from google import genai; print('google-genai: OK')"
          python -c "from elevenlabs.client import ElevenLabs; print('elevenlabs: OK')"
          python -c "import requests; print('requests: OK')"
          ffmpeg -version
          ffprobe -version

      - name: Generate daily script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING DAILY SCRIPT"
          echo "================================"

          python scripts/generate_script.py

      - name: Check generated script
        run: |
          test -f daily_script.txt
          test -s daily_script.txt

          echo "================================"
          echo "SCRIPT CREATED"
          echo "================================"

          cat daily_script.txt

      - name: Generate female voice
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVEN_LABS_API_KEY: ${{ secrets.ELEVEN_LABS_API_KEY }}
        run: |
          echo "================================"
          echo "GENERATING FEMALE VOICE"
          echo "================================"

          python scripts/generate_voice.py

          test -f voice.mp3
          test -s voice.mp3

      - name: Download video clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          echo "================================"
          echo "DOWNLOADING VIDEO CLIPS"
          echo "================================"

          python download_clips.py

      - name: Check video clips
        run: |
          echo "================================"
          echo "CHECKING VIDEO CLIPS"
          echo "================================"

          mkdir -p clips

          COUNT=$(find clips -type f \( -iname "*.mp4" -o -iname "*.mov" -o -iname "*.webm" \) | wc -l)

          echo "Video clips found: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: No video clips found."
            exit 1
          fi

      - name: Create USA Dose video
        run: |
          echo "================================"
          echo "CREATING USA DOSE HD VIDEO"
          echo "================================"

          ffprobe -version

          python create_video.py

          test -f usa_dose_short.mp4
          test -s usa_dose_short.mp4

      - name: Upload video to YouTube
        if: success()
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          echo "================================"
          echo "UPLOADING TO YOUTUBE"
          echo "================================"

          python upload_video.py

      - name: Save generated files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily_script.txt video_title.txt video_hashtags.txt

          git diff --cached --quiet || git commit -m "Generate daily USA Dose content"

          git push || true
